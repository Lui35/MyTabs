<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <style>
      /*
       * Chrome paints this page for a few milliseconds before the handoff, so
       * it matches the workspace background in both themes. Anything more
       * elaborate would just be a flash of unrelated UI.
       */
      :root {
        --bg: #fbfbfc;
        --fg: #3a3b42;
        --accent: #5b46d6;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #a1a4ad;
          --accent: #8b7bf0;
          color-scheme: dark;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }

      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        /* Only surfaces if the handoff is slow enough to notice. */
        opacity: 0;
        animation: appear 0.01s linear 0.35s forwards;
      }

      @keyframes appear {
        to {
          opacity: 1;
        }
      }

      .logo {
        width: 30px;
        height: 30px;
        color: var(--accent);
      }

      .hint {
        margin: 0;
        font-size: 13px;
      }

      a {
        color: var(--accent);
      }

      #fallback {
        display: none;
      }

      /* Revealed by newtab.js if the workspace never took over. */
      .stalled #fallback {
        display: block;
      }
      .stalled #loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect
          x="2.5"
          y="6.5"
          width="19"
          height="14"
          rx="3"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M2.5 10.5h19"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="6" cy="8.5" r="0.9" fill="currentColor" />
      </svg>

      <p class="hint" id="loading">Opening your workspace…</p>

      <p class="hint" id="fallback">
        Couldn't reach your workspace.<br />
        <a id="manual" href="#">Open it manually</a>
      </p>
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
