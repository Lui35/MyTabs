name: Release Chrome extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5c1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:extension

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./apps/extension/dist/manifest.json').version")"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version."
            exit 1
          fi

      - name: Package extension
        shell: bash
        run: |
          asset="tabs-extension-${GITHUB_REF_NAME}.zip"
          cd apps/extension/dist
          zip -r "$GITHUB_WORKSPACE/$asset" .
          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET"
          --verify-tag
          --generate-notes
          --title "Tabs Extension $GITHUB_REF_NAME"
